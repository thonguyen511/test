name: Kaggle Automator (5-min Test)

on:
  # To test our 5-minute sessions rapidly, we run the GitHub action every 10 minutes.
  # This ensures that as soon as the 5-minute session finishes, the next check catches it.
  schedule:
    - cron: '*/10 * * * *'
    
  workflow_dispatch:

jobs:
  deploy-to-kaggle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install kaggle

      - name: Run the deployment script
        run: python deploy_kaggle.py
