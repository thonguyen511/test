name: Kaggle Automator (5-min Test)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [kaggle_finish]

jobs:
  deploy-to-kaggle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install kaggle

      - name: Run the deployment script
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python deploy_kaggle.py

      - name: Commit updated sessions state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sessions.json
          git commit -m "Update sessions.json [skip ci]" || exit 0
          git push
